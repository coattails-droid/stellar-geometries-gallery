  // base layer, pale cyan on the +30° duplicate, pale violet on the +60°.
  // Accent dots, texture deck, and background are untouched.
  // Tuning knobs: DENSITY_MODULES, DENSITY_RINGS, LAYER_DIM, LAYER_TINT,
  // ORIENT_CW, ZOOM, RING_SEG, STIPPLE_DOT, STIPPLE_PITCH, the stroke width
  // divisor in drawWelded (S/1240), and the wave system in weldedSim (shard
  // flight magnitude, spin, envelope timing, radial delay spread, trains).
  // Whole-composition orientation: 75° clockwise, duplicates at +30°/+60°
  // relative (105°/135° absolute).
  const ORIENT_CW = Math.PI / 6 + Math.PI / 4;
  const LAYER_ANGLES = [ORIENT_CW, ORIENT_CW + Math.PI / 6, ORIENT_CW + Math.PI / 3];
  const LAYER_DIM = [0.66, 0.66, 0.66];
  const RING_DIM = 0.35;
  const LAYER_TINT = ["#99f6e4", "#a5f3fc", "#c4b5fd"];
  // Stipple: every line in the composition is drawn as a dotted line — dots
  // of diameter STIPPLE_DOT × lineWidth, spaced STIPPLE_PITCH × lineWidth
  // center-to-center. Dots are placed at fixed fractions along each edge in
  // the shard's local frame, so they ride the wave without swimming.
  // Tuning knobs: STIPPLE_DOT, STIPPLE_PITCH.
  const STIPPLE_DOT = 5.3;
  const STIPPLE_PITCH = 13.6;
  // Hue wash: a soft halo of the piece's hue-set colors laid across the
  // stippled linework, under the bone dots. Same dot positions as the
  // stipple (so it follows the lines exactly), WASH_R_MULT × the stipple
  // radius so neighbors merge into a continuous wash, at WASH_ALPHA over
  // the per-parent tone alpha. Colors are picked per dot by a pure integer
  // hash of (edge, dot) — deterministic, no stream draws, order-free.
  // Tuning knobs: WASH_R_MULT, WASH_ALPHA.
  const WASH_R_MULT = 4.0;
  const WASH_ALPHA = 0.22;
  // Zoom: the composition is drawn ZOOM× about the canvas center and cropped
  // by the frame — fewer, larger modules on screen, and every motion reads
  // larger too. Inherited from v1's tuning.
  const ZOOM = 0.95;
  // Geometry margin: the zoom-out shrinks the composition about the pivot,
  // so the lattice is generated over an extended frame [-gm, S+gm] and the
  // linework keeps bleeding to the canvas edge. Zero at ZOOM = 1 (no
  // behavior change there); grows as ZOOM drops. Well inside the weld's
  // ±12% clip region.
  function geoMargin(S) { return Math.max(0, (S / ZOOM - S) / 2); }
  // Global composition rotation: the entire piece (every layer, the ring
  // lattice, spokes, dots, washes) rotates as one rigid body about the
  // locked pivot before the frame crops it. Welds, traits, hashes, and the
  // motion loop are untouched; the rotated corners fall to the black
  // ground. Tuning knob: GLOBAL_ROT_CW (clockwise-positive, radians).
  const GLOBAL_ROT_CW = -Math.PI / 12; // 15° counterclockwise
  // The one locked pivot: every layer rotates about this point, and the
  // frame zoom is centered on it. All rotation centers and the zoom
  // translate read from here, so the layers can never drift apart.
  function pivot(S) { return { x: S / 2, y: S / 2 }; }
  const KIND_ORD = { h: 0, v: 1, ring: 2, spoke: 3 };  // stream-consumption order
  const KIND_DRAW = { ring: 0, spoke: 1, h: 2, v: 2 }; // stroke order (rings under grid)
  const KIND_DRAW_INV = { h: 0, v: 1, ring: 2, spoke: 3 }; // stroke order (grid under rings)

  // Stroke order for a grid trait key: the inverted fusion stacks the
  // linear grid under the ring field. Consumption order never changes, so
  // the geometry and motion streams are identical either way — only the
  // paint order flips.
  function kindDrawFor(gridKey) {
    return gridKey === "fusion-inv" ? KIND_DRAW_INV : KIND_DRAW;
  }

  // Subcell index range covering [-m, S+m] at pitch u = mod/3.
  function gridPatch(mod, S, m) {
    const u = mod / 3;
    return { u: u, i0: Math.floor(-m / u) - 1, i1: Math.ceil((S + m) / u) + 1 };
  }

  // Point-soup edges for one layer: {x1,y1,x2,y2,kind,pi} with kind
  // 'h'|'v'|'ring'|'spoke' and pi the parent index within (layer, kind), in
  // generation order. 'h'/'v' are the true-square linear grid on the module
  // lines; 'ring' edges are the RING_SEG-gon segments of each concentric
  // ring about each focus; 'spoke' edges radiate from each focus past the
  // outermost ring. Module lines are every 3rd subcell line, so the linear
  // grid never duplicates an edge: each geometric edge is generated once.
  function layerSoup(tokenHash, mod, S, layer, patch, geo) {
    const ux = patch.u, uy = patch.u;
    const ix0 = patch.i0, ix1 = patch.i1, iy0 = patch.i0, iy1 = patch.i1;
    const soup = [];
    const ang = LAYER_ANGLES[layer];
    const cosA = Math.cos(ang), sinA = Math.sin(ang);
    const pv = pivot(S);
    const cx = pv.x, cy = pv.y;
    function rot(x, y) {
      if (ang === 0) return [x, y];
      const dx = x - cx, dy = y - cy;
      return [cx + dx * cosA - dy * sinA, cy + dx * sinA + dy * cosA];
    }
    function edge(x1, y1, x2, y2, kind, pi) {
      const a = rot(x1, y1), b = rot(x2, y2);
      soup.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1], kind: kind, pi: pi });
    }
    // Inverse rotation: canvas coords back into this layer's patch frame.
    // Trait foci live in canvas coords — the same canvas point in every
    // layer — so each layer's rings land concentric on the true ring
    // centers and the motion wave radiates from them. Map each focus into
    // this layer's patch frame before generating the ring field. Rings
    // coincide across layers (crisp, trait-honest: "2 centers" reads as 2);
    // the grid and the spoke fans still rotate, which is where the
    // depth-field moire comes from.
    function unrot(x, y) {
      if (ang === 0) return [x, y];
      const dx = x - cx, dy = y - cy;
      return [cx + dx * cosA + dy * sinA, cy - dx * sinA + dy * cosA];
    }
    const foci = geo.centers.map(function (fc) {
      const p = unrot(fc.x, fc.y);
      // Keep the integer lattice coords: the base layer snaps ring
      // polygon corners onto (bi+i)·mod, (bj+j)·mod bit-exactly.
      return { x: p[0], y: p[1], bi: fc.bi, bj: fc.bj };
    });
    const x0 = ix0 * ux, x1 = ix1 * ux;
    const y0 = iy0 * uy, y1 = iy1 * uy;
    // linear grid: true squares on the module lines (every 3rd subcell line)
    const hm0 = Math.ceil(iy0 / 3), hm1 = Math.floor(iy1 / 3);
    const vm0 = Math.ceil(ix0 / 3), vm1 = Math.floor(ix1 / 3);
    let hi = 0;
    for (let m = hm0; m <= hm1; m++, hi++)
      edge(x0, m * mod, x1, m * mod, "h", hi);
    let vi = 0;
    for (let m = vm0; m <= vm1; m++, vi++)
      edge(m * mod, y0, m * mod, y1, "v", vi);
    // ring field: concentric rings about each focus at the trait's
    // seeded lattice radii (geo.radii, ascending {r, n}) — in the base
    // layer every ring polygon snaps its corners bit-exactly onto the
    // lattice vertices ((bi+i)·mod, (bj+j)·mod) with i²+j²===n, so
    // ring/spoke/grid triple points fuse to a single welded vertex;
    // the rotated layers keep uniform 64-gons (no lattice claim there) —
    // plus the focus's seeded vertex-aimed spokes (geo.spokeSets[fi]),
    // radiating past the outermost ring. One parent per ring and per
    // spoke; the weld splits each spoke at every ring and grid crossing,
    // and all spokes share the focus vertex (a welded hub).
    let ri = 0;
    let spokeId = 0; // global across foci: spoke parents must never collide
    const reach = geo.rBound + mod; // spokes radiate past the outermost ring
    const snapStep = TAU / RING_SEG; // filler smoothness matches the 64-gons
    foci.forEach(function (fc, fi) {
      for (let j = 0; j < geo.radii.length; j++) {
        const rr = geo.radii[j], r = rr.r;
        if (layer === 0) {
          // Snapped polygon: corners are integer arithmetic —
          // ((bi+i)·mod, (bj+j)·mod) — no trig, no unrot() roundtrip.
          // Arcs between consecutive corners (wrapping around) are
          // subdivided to ≤ snapStep so the ring stays as smooth as a
          // 64-gon; fillers ride the true circle (1e-13 slop irrelevant).
          const snaps = ringSnapOffsets(rr.n);
          const poly = [];
          for (let k = 0; k < snaps.length; k++) {
            const s0 = snaps[k], s1 = snaps[(k + 1) % snaps.length];
            poly.push([(fc.bi + s0.i) * mod, (fc.bj + s0.j) * mod]);
            let arc = s1.a - s0.a;
            if (arc <= 0) arc += TAU;
            const nSeg = Math.max(1, Math.ceil(arc / snapStep - 1e-12));
            for (let sg = 1; sg < nSeg; sg++) {
              const a = s0.a + (arc * sg) / nSeg;
              poly.push([fc.bi * mod + r * Math.cos(a),
                         fc.bj * mod + r * Math.sin(a)]);
            }
          }
          for (let k = 0; k < poly.length; k++) {
            const p1 = poly[k], p2 = poly[(k + 1) % poly.length];
            edge(p1[0], p1[1], p2[0], p2[1], "ring", ri);
          }
        } else {
          // Uniform 64-gon. Phase-search: the weld drops a ring whose
          // every vertex falls outside the keep-square, so when the
          // default phase misses, try finer phase offsets until a vertex
          // lands inside. (The circle always passes through the
          // keep-square — its focus is interior — so only a grazing arc
          // can still miss, and that cull is legitimate.) Rings that
          // already survive keep their exact default tessellation.
          const KK = 0.12 * S; // weld keep-square [-KK, S+KK]²
          let phase = 0;
          for (let attempt = 0; attempt < 4; attempt++) {
            let hit = false;
            for (let sgi = 0; sgi < RING_SEG && !hit; sgi++) {
              const a = phase + (sgi / RING_SEG) * TAU;
              const c = rot(fc.x + r * Math.cos(a), fc.y + r * Math.sin(a));
              hit = c[0] > -KK && c[0] < S + KK && c[1] > -KK && c[1] < S + KK;
            }
            if (hit || attempt === 3) break;
            phase += Math.PI / 128; // quarter-step: 4 distinct phases
          }
          for (let sgi = 0; sgi < RING_SEG; sgi++) {
            const a1 = phase + (sgi / RING_SEG) * TAU, a2 = phase + ((sgi + 1) / RING_SEG) * TAU;
            edge(fc.x + r * Math.cos(a1), fc.y + r * Math.sin(a1),
                 fc.x + r * Math.cos(a2), fc.y + r * Math.sin(a2), "ring", ri);
          }
        }
        ri++;
      }
      const sangles = geo.spokeSets[fi % geo.spokeSets.length];
      for (let k = 0; k < sangles.length; k++) {
        const a = sangles[k];
        edge(fc.x, fc.y, fc.x + reach * Math.cos(a), fc.y + reach * Math.sin(a),
             "spoke", spokeId++);
      }
    });
    return { soup: soup };
  }

  // Vertex quantization for welding: absorbs float dust from rotated
  // coordinates (1e-6 px is far below any visible threshold).
  const WELD_EPS = 1e-6;

  // Returns null (no touch), {t, u, x, y} (single crossing/touch point),
  // or {collinear:true, t3, t4, u1, u2} for a collinear overlap: e2's
  // endpoints project onto e1 at t3, t4; e1's endpoints onto e2 at u1, u2.
  // Collinearity matters: a spoke can lie exactly on a rotated grid line,
  // so overlap endpoints must weld too.
  function segIntersect(e1, e2, verts) {
    const p1 = verts[e1.a], p2 = verts[e1.b];
    const p3 = verts[e2.a], p4 = verts[e2.b];
    const dx1 = p2.x - p1.x, dy1 = p2.y - p1.y;
    const dx2 = p4.x - p3.x, dy2 = p4.y - p3.y;
    const den = dx1 * dy2 - dy1 * dx2;
    const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) || 1;
    // Parallel test must be relative: rotated edges on the same lattice line
    // differ by float noise (~1e-13 in den for |d|~30), far above any
    // absolute epsilon. Real crossings here are >= 30° apart (sinθ >= 0.5),
    // so sinθ < 1e-9 unambiguously means "same line".
    if (den * den < 1e-18 * (dx1 * dx1 + dy1 * dy1) * (dx2 * dx2 + dy2 * dy2)) {
      // Parallel: weld only if collinear (same line within 1e-9 px).
      const c3 = (p3.x - p1.x) * dy1 - (p3.y - p1.y) * dx1;
      const c4 = (p4.x - p1.x) * dy1 - (p4.y - p1.y) * dx1;
      if (Math.abs(c3) > 1e-9 * len1 || Math.abs(c4) > 1e-9 * len1) return null;
      const len12 = dx1 * dx1 + dy1 * dy1;
      const t3 = ((p3.x - p1.x) * dx1 + (p3.y - p1.y) * dy1) / len12;
      const t4 = ((p4.x - p1.x) * dx1 + (p4.y - p1.y) * dy1) / len12;
      const len22 = dx2 * dx2 + dy2 * dy2;
      const u1 = ((p1.x - p3.x) * dx2 + (p1.y - p3.y) * dy2) / len22;
      const u2 = ((p2.x - p3.x) * dx2 + (p2.y - p3.y) * dy2) / len22;
      const lo = Math.max(0, Math.min(t3, t4)), hi = Math.min(1, Math.max(t3, t4));
      if (hi - lo < 1e-12) return null; // touch at endpoints at most: already joined
      return { collinear: true, t3: t3, t4: t4, u1: u1, u2: u2,
               x1: p1.x, y1: p1.y, dx1: dx1, dy1: dy1,
               x2: p3.x, y2: p3.y, dx2: dx2, dy2: dy2 };
    }
    const t = ((p3.x - p1.x) * dy2 - (p3.y - p1.y) * dx2) / den;
    const u = ((p3.x - p1.x) * dy1 - (p3.y - p1.y) * dx1) / den;
    const e = 1e-9;
    if (t < -e || t > 1 + e || u < -e || u > 1 + e) return null;
    const tc = Math.min(1, Math.max(0, t));
    const uc = Math.min(1, Math.max(0, u));
    return { t: tc, u: uc, x: p1.x + tc * dx1, y: p1.y + tc * dy1 };
  }

  // Merge every layer's point-soup edges into one welded graph. Every
  // crossing or touch between any two edges — within a layer (e.g. a spoke
  // crossing a ring, a ring passing through a grid vertex) or across layers
  // — becomes a shared vertex, and edges are split there. Sub-edges fully
  // outside the canvas (plus a flex margin) are dropped: max flex is
  // 0.026·S, so they can never enter the frame. Returns:
  //   { verts, edges, parents, byParent, drawOrder, consOrder }
  // edges: {a, b, par, sub, len}; parents: {layer, kind, pi}.
  function weldEdges(soups, mod, S, kindDraw) {
    const clip = S * 0.06;
    const x0 = -clip, y0 = -clip, x1 = S + clip, y1 = S + clip;
    const KD = kindDraw || KIND_DRAW;
    const inClip = function (v) {
      return v.x > x0 - clip && v.x < x1 + clip && v.y > y0 - clip && v.y < y1 + clip;
    };
    const vmap = new Map();
    const verts = [];
    function vid(x, y) {
      const k = Math.round(x / WELD_EPS) + "," + Math.round(y / WELD_EPS);
      let i = vmap.get(k);
      if (i === undefined) { i = verts.length; verts.push({ x: x, y: y }); vmap.set(k, i); }
      return i;
    }
    const edges = [];
    soups.forEach(function (s, layer) {
      s.soup.forEach(function (e) {
        const a = vid(e.x1, e.y1), b = vid(e.x2, e.y2);
        if (a === b) return;
        edges.push({ a: a, b: b, layer: layer, kind: e.kind, pi: e.pi });
      });
    });

    // Spatial hash: only nearby edge pairs are ever tested.
    const B = mod;
    const buckets = new Map();
    edges.forEach(function (e, i) {
      const A = verts[e.a], P = verts[e.b];
      const bx0 = Math.floor(Math.min(A.x, P.x) / B), bx1 = Math.floor(Math.max(A.x, P.x) / B);
      const by0 = Math.floor(Math.min(A.y, P.y) / B), by1 = Math.floor(Math.max(A.y, P.y) / B);
      for (let bx = bx0; bx <= bx1; bx++) for (let by = by0; by <= by1; by++) {
        const k = bx + "," + by;
        let arr = buckets.get(k);
        if (!arr) { arr = []; buckets.set(k, arr); }
        arr.push(i);
      }
    });
    const splits = edges.map(function () { return []; });
    function addSplit(i, t, x, y) { splits[i].push({ t: t, x: x, y: y }); }
    const seenPair = new Set();
    const iEps = 1e-9;
    buckets.forEach(function (arr) {
      for (let n = 0; n < arr.length; n++) {
        for (let m = n + 1; m < arr.length; m++) {
          const i = arr[n], j = arr[m];
          const pk = i < j ? i * 1e7 + j : j * 1e7 + i;
          if (seenPair.has(pk)) continue;
          seenPair.add(pk);
          const e1 = edges[i], e2 = edges[j];
          if (e1.a === e2.a || e1.a === e2.b || e1.b === e2.a || e1.b === e2.b) continue; // already joined
          const sameGeom = (e1.a === e2.a && e1.b === e2.b) || (e1.a === e2.b && e1.b === e2.a);
          if (sameGeom) continue; // identical duplicates: split identically via others
          const r = segIntersect(e1, e2, verts);
          if (!r) continue;
          if (r.collinear) {
            // weld the overlap endpoints that fall strictly inside an edge
            for (const tt of [r.t3, r.t4]) {
              if (tt > iEps && tt < 1 - iEps)
                addSplit(i, tt, r.x1 + tt * r.dx1, r.y1 + tt * r.dy1);
            }
            for (const uu of [r.u1, r.u2]) {
              if (uu > iEps && uu < 1 - iEps)
                addSplit(j, uu, r.x2 + uu * r.dx2, r.y2 + uu * r.dy2);
            }
            continue;
          }
          const tIn = r.t > iEps && r.t < 1 - iEps;
          const uIn = r.u > iEps && r.u < 1 - iEps;
          if (tIn && uIn) { addSplit(i, r.t, r.x, r.y); addSplit(j, r.u, r.x, r.y); }
          else if (tIn) addSplit(i, r.t, r.x, r.y); // e2's endpoint touches e1
          else if (uIn) addSplit(j, r.u, r.x, r.y); // e1's endpoint touches e2
          // endpoint-endpoint: already the same vertex via vid()
        }
      }
    });

    // Split every edge at its collected points, in order along the edge.
    // Sub-edges fully outside the clip bounds are dropped.
    const sub = [];
    edges.forEach(function (e, i) {
      const sp = splits[i];
      if (!sp.length) {
        const A0 = verts[e.a], B0 = verts[e.b];
        if (inClip(A0) || inClip(B0)) {
          const dx0 = B0.x - A0.x, dy0 = B0.y - A0.y;
          sub.push({ a: e.a, b: e.b, layer: e.layer, kind: e.kind, pi: e.pi, sub: 0,
                     len: Math.sqrt(dx0 * dx0 + dy0 * dy0) });
        }
        return;
      }
      sp.sort(function (p, q) { return p.t - q.t; });
      const pts = [{ t: 0, v: e.a }];
      sp.forEach(function (s) {
        const last = pts[pts.length - 1];
        if (Math.abs(s.t - last.t) < 1e-9) return;
        const v = vid(s.x, s.y);
        if (v === last.v) return;
        pts.push({ t: s.t, v: v });
      });
      const last = pts[pts.length - 1];
      if (last.v !== e.b && Math.abs(1 - last.t) >= 1e-9) pts.push({ t: 1, v: e.b });
      else if (last.v !== e.b) last.t = 1;
      for (let k = 0; k < pts.length - 1; k++) {
        if (pts[k].v === pts[k + 1].v) continue;
        const A = verts[pts[k].v], B = verts[pts[k + 1].v];
        if (!inClip(A) && !inClip(B)) continue;
        const dx = B.x - A.x, dy = B.y - A.y;
        sub.push({ a: pts[k].v, b: pts[k + 1].v, layer: e.layer, kind: e.kind,
                   pi: e.pi, sub: k, len: Math.sqrt(dx * dx + dy * dy) });
      }
    });

    // Deterministic vertex order: sort by (y, x), remap, then sort edges.
    const order = verts.map(function (v, i) { return i; })
      .sort(function (a, b) { return verts[a].y - verts[b].y || verts[a].x - verts[b].x; });
    const remap = new Array(verts.length);
    const sverts = order.map(function (old, ni) { remap[old] = ni; return verts[old]; });
    sub.forEach(function (e) { e.a = remap[e.a]; e.b = remap[e.b]; });
    sub.sort(function (p, q) {
      return p.layer - q.layer || p.a - q.a || p.b - q.b || p.sub - q.sub;
    });

    // Parents in first-appearance order; consumption/draw orders derived.
    const pmap = new Map();
    const parents = [];
    sub.forEach(function (e) {
      const k = e.layer + ":" + e.kind + ":" + e.pi;
      let pi = pmap.get(k);
      if (pi === undefined) { pi = parents.length; parents.push({ layer: e.layer, kind: e.kind, pi: e.pi }); pmap.set(k, pi); }
      e.par = pi;
    });
    const byParent = parents.map(function () { return []; });
    sub.forEach(function (e, i) { byParent[e.par].push(i); });
    byParent.forEach(function (list) {
      list.sort(function (a, b) { return sub[a].sub - sub[b].sub; });
    });
    // Parent centroids (mean of sub-edge midpoints, in graph coordinates):
    // the motion wave keys each parent's delay to its position, so the
    // lattice undulates coherently instead of shimmering at random.
    parents.forEach(function (par, pi) {
      const list = byParent[pi];
      let sx = 0, sy = 0;
      for (let li = 0; li < list.length; li++) {
        const e = sub[list[li]];
        const A = sverts[e.a], B = sverts[e.b];
        sx += (A.x + B.x) * 0.5; sy += (A.y + B.y) * 0.5;
      }
      par.cx = list.length ? sx / list.length : 0;
      par.cy = list.length ? sy / list.length : 0;
    });
    const consOrder = parents.map(function (p, i) { return i; }).sort(function (a, b) {
      const A = parents[a], B = parents[b];
      return A.layer - B.layer || KIND_ORD[A.kind] - KIND_ORD[B.kind] || A.pi - B.pi;
    });
    const drawOrder = parents.map(function (p, i) { return i; }).sort(function (a, b) {
      const A = parents[a], B = parents[b];
      return B.layer - A.layer || KD[A.kind] - KD[B.kind] || A.pi - B.pi;
    });
    return { verts: sverts, edges: sub, parents: parents, byParent: byParent,
             drawOrder: drawOrder, consOrder: consOrder };
  }

  // Per-parent edge alpha. Every layer breathes gently (±8%) around a
  // 0.45–0.85 tone base so no stroke ever dips near invisibility while
  // sweeping through its motion. LAYER_DIM is [0.66,0.66,0.66]: all
  // linework renders at 66% alpha.
  function edgeAlpha(kind, layer, toneVal, m, pidx, phase) {
    const salt = kind === "ring" ? 3 : kind === "spoke" ? 5 : 7;
    const base = (0.45 + toneVal * 0.40) * (1 + 0.08 * osc(m.k, ephi(m.seed, pidx, salt), phase));
    return base * LAYER_DIM[layer];
  }

  const graphCache = new Map();

  function fusedGraph(tokenHash, S, mod, gridKey) {
    gridKey = gridKey || "fusion";
    const key = tokenHash + "|" + S + "|" + mod + "|rings|" + gridKey;
    let G = graphCache.get(key);
    if (G) return G;
    const t = Traits.deriveTraits(tokenHash);
    const geo = makeGeo(tokenHash, t, mod, S);
    const m = S * 0.22;
    const soups = [
      layerSoup(tokenHash, mod, S, 0, gridPatch(mod, S, geoMargin(S)), geo),
      layerSoup(tokenHash, mod, S, 1, gridPatch(mod, S, m), geo),
      layerSoup(tokenHash, mod, S, 2, gridPatch(mod, S, m), geo),
    ];
    G = weldEdges(soups, mod, S, kindDrawFor(gridKey));
    G.parBBox = parentBBoxes(G);
    G.geo = geo;
    if (graphCache.size > 48) graphCache.clear(); // bound memory: the gallery holds many tokens
    graphCache.set(key, G);
    return G;
  }

  // Per-parent bounding boxes, in graph coords. Used for sizing shard
  // rotation.
  function parentBBoxes(G) {
    return G.parents.map(function (par, pi) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      const verts = G.verts, list = G.byParent[pi];
      for (let i = 0; i < list.length; i++) {
        const se = G.edges[list[i]];
        const A = verts[se.a], B = verts[se.b];
        if (A.x < x0) x0 = A.x; if (B.x < x0) x0 = B.x;
        if (A.y < y0) y0 = A.y; if (B.y < y0) y0 = B.y;
        if (A.x > x1) x1 = A.x; if (B.x > x1) x1 = B.x;
        if (A.y > y1) y1 = A.y; if (B.y > y1) y1 = B.y;
      }
      return [x0, y0, x1, y1];
    });
  }

  // Motion parameters drawn from their OWN domain stream ("motion"), so
  // adding animation never shifts the structure/tone/accent streams. Drawn in
  // a fixed order. These drive the gentle alpha breathing; the lattice's
  // big motion is the wave system below, on its own "motion:wave*" streams.
  function drawSys(s, ampMul) {
    return { k: 1 + Math.floor(s() * 3), seed: s() * 100 };
  }

  // Builds one parent's path as a shard (used by rasterWelded). Each parent
  // is one shard: when its wave envelope is 0 the path is drawn exactly in
  // place (straight edges, identical to the static piece); mid-envelope the
  // whole shard is rotated about its own centroid, stretched outward from
  // it (k >= 1, seeded per shard), and translated outward, so the lattice
  // lifts into flying, extending pieces and settles back into place as the
  // wavefront passes. Because every shard's envelope is periodic in the
  // loop phase, the animation loops seamlessly.
  // Shard-local transform for one parent: rotate about its centroid by tr,
  // stretch k about it, translate (dx, dy). Null when the shard is at rest
  // (no transform) — points pass through unchanged.
  function shardXform(par, tr) {
    if (!tr) return null;
    return { cx: par.cx, cy: par.cy, cos: tr.c, sin: tr.s, dx: tr.dx, dy: tr.dy, k: tr.k };
  }
  function xformPt(xf, x, y) {
    if (!xf) return [x, y];
    const ax = (x - xf.cx) * xf.k, ay = (y - xf.cy) * xf.k;
    return [xf.cx + ax * xf.cos - ay * xf.sin + xf.dx,
            xf.cy + ax * xf.sin + ay * xf.cos + xf.dy];
  }
  // Stippled linework: every edge becomes a row of dots — dot radius dotR,
  // pitch center-to-center — placed at fixed fractions along the edge in the
  // shard's local frame so the dots ride the wave without swimming. The
  // dot COUNT per edge is derived from the un-stretched length (transformed
  // length divided by the shard's stretch k), so it never changes mid-loop:
  // no dots pop in or out as shards fly.
  // All dots go into the current path; the caller fills once.
  function stippleShardPath(ctx, G, par, list, shardXf, parIdx, dotR, pitch) {
    const verts = G.verts, edges = G.edges;
    const tr = shardXf[parIdx];
    const xf = shardXform(par, tr);
    const k = tr ? tr.k : 1;
    for (let li = 0; li < list.length; li++) {
      const e = edges[list[li]];
      const A = verts[e.a], B = verts[e.b];
      const p0 = xformPt(xf, A.x, A.y), p1 = xformPt(xf, B.x, B.y);
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
      const len = Math.sqrt(dx * dx + dy * dy) / k;
      if (len < 1e-9) continue;
      // len is in composition coords; the canvas draws at ZOOM×, and pitch
      // is in canvas coords — scale up so the dot spacing matches.
      const n = Math.max(1, Math.round(len * ZOOM / pitch));
      for (let i = 0; i < n; i++) {
        const t = (i + 0.5) / n;
        const x = p0[0] + dx * t, y = p0[1] + dy * t;
        ctx.moveTo(x + dotR, y);
        ctx.arc(x, y, dotR, 0, TAU);
      }
    }
  }

  // Wash color bucket for one stipple dot: pure integer hash of the edge
  // index and dot index — deterministic across frames, consumes no stream,
  // so it can never shift the structure/tone/accent stream order.
  function washPick(li, i, nHues) {
    let h = ((li * 2654435761) ^ (i * 40503)) >>> 0;
    h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
    return h % nHues;
  }

  // Wash pass: the same walk as stippleShardPath, but only the dots
  // assigned to color bucket wc, drawn at the wash radius. Same positions
  // as the stipple, so the wash follows the linework exactly.
  function washShardPath(ctx, G, par, list, shardXf, parIdx, washR, pitch, wc, nHues) {
    const verts = G.verts, edges = G.edges;
    const tr = shardXf[parIdx];
    const xf = shardXform(par, tr);
    const k = tr ? tr.k : 1;
    for (let li = 0; li < list.length; li++) {
      const e = edges[list[li]];
      const A = verts[e.a], B = verts[e.b];
      const p0 = xformPt(xf, A.x, A.y), p1 = xformPt(xf, B.x, B.y);
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
      const len = Math.sqrt(dx * dx + dy * dy) / k;
      if (len < 1e-9) continue;
      const n = Math.max(1, Math.round(len * ZOOM / pitch));
      for (let i = 0; i < n; i++) {
        if (washPick(li, i, nHues) !== wc) continue;
        const t = (i + 0.5) / n;
        const x = p0[0] + dx * t, y = p0[1] + dy * t;
        ctx.moveTo(x + washR, y);
        ctx.arc(x, y, washR, 0, TAU);
      }
    }
  }

  // Shared radial-wave flight: the accent dots ride the same outward wave
  // as the shards. Pure math — no stream draws — so call sites keep their
  // exact stream order.
  function waveFlight(x, y, field, mu, trains, dly, uf, flyRange) {
    const e = mu < 0 ? 0 : waveEnv(frac(mu * trains - dly));
    const outFrac = (flyRange[0] + (flyRange[1] - flyRange[0]) * uf) * e;
    return { x: x + (x - field.x) * outFrac, y: y + (y - field.y) * outFrac };
  }

  // Simulation: consumes all motion/tone/structure streams and computes the
  // per-frame values that do not depend on canvas state.
  // holdBox is the visible window [x0,y0,x1,y1]: the wave's amplitude damps
  // to zero at the frame's edge, so linework crossing the frame keeps
  // crossing it at every phase.
  function weldedSim(G, tokenHash, geo, SU, phase, fieldRegion, holdBox) {
    const mots = [];
    const sM = SeedKit.streamFor(tokenHash, "motion");
    const mLin = drawSys(sM, 2); drawSys(sM); drawSys(sM); drawSys(sM);
    const sMT = SeedKit.streamFor(tokenHash, "motion:overlay");
    drawSys(sMT); const mRing = drawSys(sMT, 1.5); drawSys(sMT); drawSys(sMT);
    mots.push({ lin: mLin, ring: mRing });
    ["dup30", "dup60"].forEach(function (tag) {
      const s = SeedKit.streamFor(tokenHash, "motion:" + tag);
      mots.push({ lin: drawSys(s, 2), ring: drawSys(s, 1.5) });
    });

    // Per-parent alpha, consumed in a fixed order per layer.
    const toneStreams = [
      SeedKit.streamFor(tokenHash, "tone"),
      SeedKit.streamFor(tokenHash, "tone:dup30"),
      SeedKit.streamFor(tokenHash, "tone:dup60"),
    ];
    const alpha = new Float64Array(G.parents.length);
    G.consOrder.forEach(function (parIdx, ci) {
      const par = G.parents[parIdx];
      const m = (par.kind === "ring" || par.kind === "spoke") ? mots[par.layer].ring : mots[par.layer].lin;
      let a = edgeAlpha(par.kind, par.layer, toneStreams[par.layer](), m, ci, phase);
      // Ring fade: outer rings render fainter — ripples dissipate with
      // distance — so dense multi-focus pieces keep their concentric
      // legibility instead of collapsing into arc noise. A ring parent's
      // pi is centerIdx*ringCount + j, so j = pi % ringCount; the
      // innermost ring draws at full alpha, the outermost at 20%.
      if (par.kind === "ring") {
        const j = par.pi % geo.ringCount;
        a *= 1 - 0.8 * (j / Math.max(1, geo.ringCount - 1));
      }
      // Spokes are fine detail: render them subordinate to the rings so the
      // concentric architecture stays the hero of the piece.
      if (par.kind === "spoke") a *= 0.55;
      // Ring-field balance: the rings coincide across all three layers
      // (3x overdraw on every arc plus wash accumulation), so the circular
      // field reads much brighter than the single-drawn linear grids.
      // RING_DIM rebalances the two — 1.0 is the original ring-dominant
      // look, lower values hand the piece back to the grids.
      if (par.kind === "ring" || par.kind === "spoke") a *= RING_DIM;
      alpha[parIdx] = a;
    });

    // Wave system: one shard per parent. Params come from their own domain
    // streams ("motion:wave*"), drawn in the same fixed consOrder. Each
    // shard lifts as its wavefront passes (with a seeded direction jitter),
    // twists out and back about its own centroid (seeded direction, max
    // ~120°, unwound before the wave finishes so it glides home straight
    // with no snap), stretches outward from that centroid (seeded amount,
    // scaled by the envelope), and waits its turn on a radial delay from
    // the nearest ring center — the wave radiates outward from every focus
    // and the lattice settles in the same order.
    const field = waveField(geo.centers, fieldRegion);
    const waveStreams = [
      SeedKit.streamFor(tokenHash, "motion:wave"),
      SeedKit.streamFor(tokenHash, "motion:wave:dup30"),
      SeedKit.streamFor(tokenHash, "motion:wave:dup60"),
    ];
    const shardXf = new Array(G.parents.length);
    const mu = motionMu(phase); // -1 at rest: every shard transform is null
    const trains = geo.trains;
    // Nearest focus per point: the wave radiates outward from every ring
    // center, so each shard's flight direction keys on its own nearest
    // focus (the same one its delay keys on), not the field's center of
    // mass — the displacement field stays concentric about every focus.
    function nearestFocus(x, y) {
      let bx = field.centers[0].x, by = field.centers[0].y, bd = Infinity;
      for (let fi = 0; fi < field.centers.length; fi++) {
        const fc = field.centers[fi];
        const fdx = x - fc.x, fdy = y - fc.y, fd = fdx * fdx + fdy * fdy;
        if (fd < bd) { bd = fd; bx = fc.x; by = fc.y; }
      }
      return { x: bx, y: by };
    }
    G.consOrder.forEach(function (parIdx) {
      const par = G.parents[parIdx];
      const sS = waveStreams[par.layer];
      const u1 = sS(), u2 = sS(), u3 = sS(), u4 = sS(), u5 = sS();
      const nf = nearestFocus(par.cx, par.cy);
      const dx0 = par.cx - nf.x, dy0 = par.cy - nf.y;
      const ang = Math.atan2(dy0, dx0) + (u2 - 0.5) * 1.4;
      const mag = SU * (0.02 + 0.11 * u1) * 0.67; // flight: 0.0134–0.0871·SU
      const dir = u3 < 0.5 ? -1 : 1; // seeded spin direction
      const stretch = 0.15 + 0.45 * u5; // shard grows 1.15–1.60x at envelope peak
      // Radial delay, bounded by WAVE_DMAX (0.20/1.12) so delay + envelope
      // active zone (0.80) <= 1 per train: every shard finishes settling
      // exactly as the motion window closes, and at rest all local clocks
      // sit in the forced rest zone (static piece intact).
      const delay = waveDelay(field, par.cx, par.cy, u4);
      const x = mu < 0 ? 0 : frac(mu * trains - delay); // the shard's local clock
      const e = mu < 0 ? 0 : waveEnv(x);
      // Frame hold: the envelope is scaled by the shard's hold weight, so
      // shards near the frame's edge stay pinned to their rest geometry and
      // the linework keeps bleeding past the frame at every phase. The
      // shard stays rigid — the whole transform simply shrinks toward rest.
      const holdW = holdWeight(par.cx, par.cy, holdBox, SU);
      const we = e * holdW;
      // Full-turn spin: eases from 0 to SPIN_TURNS seeded-direction turns
      // over the spin window, then holds — the shard lands exactly where
      // it started (a full turn ≡ 0°), so the transform releases with no
      // snap. Deliberately not scaled by the hold weight: only whole turns
      // are seamless at release.
      const spin = dir * TAU * SPIN_TURNS * spinProg(x);
      shardXf[parIdx] = we === 0 ? null : {
        c: Math.cos(spin), s: Math.sin(spin),
        dx: Math.cos(ang) * mag * we, dy: Math.sin(ang) * mag * we,
        k: 1 + stretch * we,
      };
    });

    return { mots: mots, alpha: alpha, shardXf: shardXf, field: field,
             trains: trains };
  }

  // Raster: draws the welded linework.
  function rasterWelded(ctx, sim, G, SU, strokeW, phase, washColors) {
    const mots = sim.mots, alpha = sim.alpha;
    const shardXf = sim.shardXf;
    const verts = G.verts, edges = G.edges, parents = G.parents;
    const drawOrder = G.drawOrder, byParent = G.byParent;
    line(ctx, Math.max(0.5, strokeW));
    // Stipple geometry from the line width: dots of diameter
    // STIPPLE_DOT × strokeW, spaced STIPPLE_PITCH × strokeW.
    const dotR = Math.max(0.5, strokeW) * STIPPLE_DOT / 2;
    const pitch = Math.max(0.5, strokeW) * STIPPLE_PITCH;
    const washR = dotR * WASH_R_MULT;
    const nHues = washColors.length;

    // Stroke every parent's sub-edges. Dim layers first, base layer last;
    // within each layer the stroke order follows the grid trait — ring
    // field under the linear grid, or inverted (grid under ring field).
    // Each parent first lays its hue wash (one batched fill per hue color,
    // under the per-parent tone alpha), then its stippled linework on top.
    //
    // Hot path: plain for-loops; each shard's transform is computed once
    // per parent in the sim, so the raster is just rotate+translate math.
    // Two passes: all hue washes first, then all stippled linework. The
    // wash is a background glow — it must sit under every parent's
    // linework, not just its own. (Interleaving wash/stipple per parent
    // lets a later parent's wash dim an earlier parent's stipple.)
    for (let di = 0; di < drawOrder.length; di++) {
      const parIdx = drawOrder[di];
      const par = parents[parIdx];
      const list = byParent[parIdx];
      if (!list.length) continue;
      for (let wc = 0; wc < nHues; wc++) {
        ctx.fillStyle = washColors[wc];
        ctx.globalAlpha = alpha[parIdx] * WASH_ALPHA;
        ctx.beginPath();
        washShardPath(ctx, G, par, list, shardXf, parIdx, washR, pitch, wc, nHues);
        // Defensive: pureimage's fill can choke on certain path geometries
        // (observed with token 20's wash). If the fill fails, skip this
        // wash layer — the stipples and dots still render.
        try { ctx.fill(); } catch (e) { /* skip wash */ }
      }
    }
    for (let di = 0; di < drawOrder.length; di++) {
      const parIdx = drawOrder[di];
      const par = parents[parIdx];
      const list = byParent[parIdx];
      if (!list.length) continue;
      ctx.fillStyle = LAYER_TINT[par.layer];
      ctx.globalAlpha = alpha[parIdx];
      ctx.beginPath();
      stippleShardPath(ctx, G, par, list, shardXf, parIdx, dotR, pitch);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // The visible window in composition coords: the zoom is a ctx transform,
  // so the wave normalizes to what the viewer actually sees.
  function visibleRegion(S) {
    const r = S / (2 * ZOOM);
    return [S / 2 - r, S / 2 - r, S / 2 + r, S / 2 + r];
  }

  // Frame-hold weight for one point (a shard centroid or dot) against the
  // visible window box. 0 at the frame's edge — linework anchored there
  // keeps bleeding past the frame at every phase — ramping smoothly to 1
  // over EDGE_HOLD·S inside, so there is no visible pinned/moving seam.
  // Shards are weighted by centroid, not bbox: a long grid line stays wild
  // in the interior even while its far end holds the frame.
  function holdWeight(x, y, box, S) {
    if (!box) return 1;
    if (x < box[0] || x > box[2] || y < box[1] || y > box[3]) return 0;
    const d = Math.min(x - box[0], box[2] - x, y - box[1], box[3] - y);
    if (d <= 0) return 0;
    const f = EDGE_HOLD * S;
    return d >= f ? 1 : sstep(0, f, d);
  }

  function drawWelded(ctx, S, G, unit, P, geo, tokenHash, phase) {
    const region = visibleRegion(S);
    const sim = weldedSim(G, tokenHash, geo, S, phase, region, region);
    rasterWelded(ctx, sim, G, S, S / 1240, phase, P.accents);
  }

  // --- Accent layer: the four dot rings -----------------------------------
  // Every piece carries an inner ring of ACCENT_DOTS dots, an outer
  // ring of up to ACCENT_DOTS_OUTER dots, and two middle rings of up to
  // ACCENT_DOTS_MID1 and ACCENT_DOTS_MID2 dots — 99 per piece, all inside the
  // visible frame. The dot-grid trait picks which
  // vertex set they sit on: "square" (the linear grid's square-grid
  // vertices — the original behavior), "triangle" (interior third-points
  // of each module), or "circle" (ring/spoke crossing points). The inner
  // ring takes the ACCENT_DOTS candidates nearest the piece center, the
  // outer ring the ACCENT_DOTS_OUTER candidates nearest the frame edge,
  // and the two middle rings the next-farthest unoccupied candidates
  // (each ring claiming only what the earlier rings left).
  // at the same size; colors come from the piece's hue set. As a wavefront
  // passes, each dot rides the same radial wave as the shards around it —
  // flying outward from the nearest ring center (a seeded fraction of its
  // radial distance, so they never overshoot). The accent layer keeps full
  // visibility through the whole motion — the dots fly without dissolving,
  // and settle back as the lattice reconfigures.
  // Square-grid vertices of the linear grid: a welded vertex qualifies when
  // some layer has two perpendicular axis-aligned incident edges, measured
  // in that layer's own rotated frame. Ring arcs and spokes sit at other
  // angles and never qualify (a ring arc is axis-aligned only at its
  // cardinal tangent, where it meets a grid vertex that already qualifies),
  // so the set is exactly the square grid's intersections.
  function squareGridVertSet(G, angles) {
    const set = new Set();
    const n = G.verts.length;
    const bits = new Uint8Array(n * 3); // per vertex per layer: 1 = axis-u, 2 = axis-v
    const cosA = angles.map(function (a) { return Math.cos(a); });
    const sinA = angles.map(function (a) { return Math.sin(a); });
    for (let ei = 0; ei < G.edges.length; ei++) {
      const e = G.edges[ei];
      const L = e.layer;
      const A = G.verts[e.a], B = G.verts[e.b];
      const dx = B.x - A.x, dy = B.y - A.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      if (len === 0) continue;
      const au = Math.abs((dx * cosA[L] + dy * sinA[L]) / len);
      const av = Math.abs((-dx * sinA[L] + dy * cosA[L]) / len);
      let bit = 0;
      if (au > 0.99999) bit = 1;
      else if (av > 0.99999) bit = 2;
      if (bit) { bits[e.a * 3 + L] |= bit; bits[e.b * 3 + L] |= bit; }
    }
    for (let i = 0; i < n; i++)
      for (let L = 0; L < 3; L++)
        if ((bits[i * 3 + L] & 3) === 3) { set.add(i); break; }
    return set;
  }

  // Circle-vertex set: every welded vertex where a ring edge and a spoke
  // edge meet — the ring/spoke crossing points of the ring lattice. The
  // weld splits each spoke at every ring crossing, so every crossing is a
  // vertex carrying sub-edges of both kinds. Any layer counts: rings
  // coincide across layers while the spoke fans rotate, so each layer
  // contributes its own crossings. The focus hubs carry spokes but no
  // rings, so they never qualify — the set is strictly the intersections.
  function circleVertSet(G) {
    const set = new Set();
    const n = G.verts.length;
    const hasRing = new Uint8Array(n), hasSpoke = new Uint8Array(n);
    for (let ei = 0; ei < G.edges.length; ei++) {
      const e = G.edges[ei];
      if (e.kind === "ring") { hasRing[e.a] = 1; hasRing[e.b] = 1; }
      else if (e.kind === "spoke") { hasSpoke[e.a] = 1; hasSpoke[e.b] = 1; }
    }
    for (let i = 0; i < n; i++)
      if (hasRing[i] && hasSpoke[i]) set.add(i);
    return set;
  }

  // Triangle-vertex points: the interior third-points of every module in the
  // base layer's frame — (i + a/3)·mod × (j + b/3)·mod for a,b in {1,2} —
  // rotated into canvas coords with the same rotation the layer soup uses.
  // The tidal engine has no triangle field of its own (v1's was replaced by
  // the ring field), so this is the honest "triangle lattice" reading of
  // the module system: the vertices a triangulated module adds beyond its
  // corners, in v1's TRI_SUBDIV=3 language. Base-layer frame only, keeping
  // the set crisp and legible. Returns [{x, y, id}] with stable synthetic
  // ids (these are computed points, not graph vertices).
  function triangleVertPoints(mod, S, region, margin) {
    const ang = LAYER_ANGLES[0];
    const cosA = Math.cos(ang), sinA = Math.sin(ang);
    const cx = S / 2, cy = S / 2;
    const rx0 = region[0] - margin, ry0 = region[1] - margin;
    const rx1 = region[2] + margin, ry1 = region[3] + margin;
    const pts = [];
    const i1 = Math.ceil(S / mod) + 2;
    for (let i = -2; i <= i1; i++)
      for (let j = -2; j <= i1; j++)
        for (let a = 1; a <= 2; a++)
          for (let b = 1; b <= 2; b++) {
            const px = (i + a / 3) * mod, py = (j + b / 3) * mod;
            const dx = px - cx, dy = py - cy;
            const x = cx + dx * cosA - dy * sinA;
            const y = cy + dx * sinA + dy * cosA;
            if (x < rx0 || x > rx1 || y < ry0 || y > ry1) continue;
            pts.push({ x: x, y: y,
                       id: ((i + 16) * 64 + (j + 16)) * 4 + (a - 1) * 2 + (b - 1) });
          }
    return pts;
  }

  // Simulation: consumes the accent-dot streams and computes per-dot
  // placement, color, and wave flight (the accent layer keeps full
  // visibility through the motion). gridRegion is [x0, y0, x1, y1]: the
  // square path passes the visible window; its center anchors the ring and
  // a dot-radius margin keeps every dot on-canvas. angles is the per-layer
  // rotation table (LAYER_ANGLES). The dot-grid trait (geo.dotGrid) picks

const ux = x => x * PX - 1, uy = y => 1 - y * PX;
const HASH = GEO.hash;
// Stellar palette: locked multicolor look (Calvin 2026-10-14 — trait removed, back to lock).
const PALETTE = "stellar";
function lerp3(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
const PAL = (() => {
  // Stellar locked palette (multicolor): amber/coral/pink/violet dot ramp (Calvin 2026-10-13/14)
  const inner = hexRgb("#ffd98f"), outer = hexRgb("#8e2f6e");
  return {
    shellCols: [0, 1, 2, 3, 4, 5].map(k => lerp3(inner, outer, k / 5)),
    lattice: hexRgb("#ffcf9e"), latticeMul: 0.72,
    dotRamp: ["#ffcf6e", "#ff9e4a", "#ff6e5e", "#e84f9e", "#9a5fd0"].map(hexRgb),
    web3: ["#ffc46e", 0.15], web6: ["#ffc46e", 1.0], web9: ["#c46eff", 0.125],
    web12: ["#ff7a4d", 0.10],
    core: "#ffab5a",
    wash: ["#ffcf6e", "#ff8a5e", "#e84f7e"], washMul: 0.64,
  };
})();
const LINE = hexRgb("#bfffd2"); // light neon-green linework (midnight)

// foci: x/y from the engine, z hash-seeded
const foci = GEO.foci.map((f, i) => [
  ux(f.x), uy(f.y),
  ((cyrb53(HASH + "::focus3d::" + i) % 1000) / 1000 - 0.5) * 0.6
]);
const radii = GEO.radii.map(o => o.r * PX);
// central vertex: midpoint of the two foci — the camera's aim point
const CV = [(foci[0][0]+foci[1][0]+foci[2][0]+foci[3][0]+foci[4][0])/5, (foci[0][1]+foci[1][1]+foci[2][1]+foci[3][1]+foci[4][1])/5,
            (foci[0][2]+foci[1][2]+foci[2][2]+foci[3][2]+foci[4][2])/5];
const RMAX = Math.max.apply(null, radii);

// family point sets (structure-of-arrays)
function newFam(n) {
  return { n, x: new Float32Array(n), y: new Float32Array(n), z: new Float32Array(n),
           r: new Float32Array(n), g: new Float32Array(n), b: new Float32Array(n),
           dx: new Float32Array(n), dy: new Float32Array(n), dz: new Float32Array(n),
           dist: new Float32Array(n), ring: new Int8Array(n), ang: new Float32Array(n) };
}

// shells: token's ring radii as fibonacci spheres about each focus
const shells = [];
for (let fi = 0; fi < 5; fi++) {
  for (let ri = 0; ri < radii.length; ri++) {
    const R = radii[ri];
    const shc = PAL.shellCols ? PAL.shellCols[ri % PAL.shellCols.length] : LINE;
    const n = Math.round(250 + 650 * (R / RMAX) * (R / RMAX));
    const s = newFam(n), sp = fibSphere(n), F = foci[fi];
    for (let i = 0; i < n; i++) {
      s.x[i] = F[0] + R * sp[i * 3];
      s.y[i] = F[1] + R * sp[i * 3 + 1];
      s.z[i] = F[2] + R * sp[i * 3 + 2];
      s.dx[i] = sp[i * 3]; s.dy[i] = sp[i * 3 + 1]; s.dz[i] = sp[i * 3 + 2];
      s.dist[i] = R;
      s.r[i] = shc[0]; s.g[i] = shc[1]; s.b[i] = shc[2];
    }
    shells.push(s);
  }
}

// lattices: 3 cubic grids rotated about z by the layer angles (radians),
// in the monochrome line tone. Shells pass through the coarse vertices.
const lattices = [];
{
  const LP = 0.25, RV = 1.9, base = [];
  for (let ix = -RV; ix <= RV + 1e-9; ix += LP)
    for (let iy = -RV; iy <= RV + 1e-9; iy += LP)
      for (let iz = -RV; iz <= RV + 1e-9; iz += LP)
        if (ix * ix + iy * iy + iz * iz <= RV * RV) base.push(ix, iy, iz);
  const nb = base.length / 3;
  for (const a of GEO.layerAngles) {
    const ca = Math.cos(a), sa = Math.sin(a), L = newFam(nb);
    for (let i = 0; i < nb; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      L.x[i] = ca * x - sa * y;
      L.y[i] = sa * x + ca * y;
      L.z[i] = base[i * 3 + 2];
      const lc = PAL.lattice || LINE;
      L.r[i] = lc[0] * PAL.latticeMul; L.g[i] = lc[1] * PAL.latticeMul; L.b[i] = lc[2] * PAL.latticeMul;
    }
    lattices.push(L);
  }
}

// stars: the hash dots plus deterministic fillers topping up short rings
// (design 12/21/33/33); the whole field is then duplicated at 30°/60°
// clockwise → 3x stars. Copies keep color/ring/blink.
const dotList = GEO.dots.map((d, k) => ({
  x: ux(d.x), y: uy(d.y),
  z: ((cyrb53(HASH + "::star3d::" + k) % 1000) / 1000 - 0.5) * 0.9,
  color: d.color, ring: k < 12 ? 0 : k < 33 ? 1 : k < 66 ? 2 : 3
}));
{
  // a dump can come up short of a ring's designed count (token 1: 10 of the
  // outer ring's 33) — top up short rings with golden-angle fillers on the
  // ring's mean radius (deterministic). rings a token doesn't have at all
  // (sparse traits) are left alone, not invented.
  const pal = [...new Set(dotList.map(d => d.color))];
  const designed = GEO.dotRings || [12, 21, 33, 33];
  for (let r = 0; r < 4; r++) {
    const inR = dotList.filter(d => d.ring === r);
    const short = (designed[r] || 0) - inR.length;
    if (!inR.length || short <= 0) continue;
    const rad = inR.reduce((s, d) => s + Math.hypot(d.x, d.y), 0) / inR.length;
    for (let j = 0; j < short; j++) {
      const ang = j * 2.399963;
      const rr = rad * (0.94 + 0.12 * (((j * 5) % 7) / 6));
      dotList.push({ x: Math.cos(ang) * rr, y: Math.sin(ang) * rr,
                     z: (((j * 0.618034) % 1) - 0.5) * 0.9,
                     color: pal[j % pal.length], ring: r });
    }
  }
}
const stars = newFam(dotList.length * 3);
dotList.forEach((d, k) => {
  const x = d.x, y = d.y, z = d.z;
  const c = PAL.dotRamp ? PAL.dotRamp[cyrb53(d.color) % PAL.dotRamp.length]
                      : hexRgb(d.color);
  let nf = 0, bd = Infinity;
  for (let fi = 0; fi < 5; fi++) {
    const ex = x - foci[fi][0], ey = y - foci[fi][1], ez = z - foci[fi][2];
    const dd = ex * ex + ey * ey + ez * ez;
    if (dd < bd) { bd = dd; nf = fi; }
  }
  const dd = Math.sqrt(bd) || 1e-9, F = foci[nf];
  stars.x[k] = x; stars.y[k] = y; stars.z[k] = z;
  stars.dx[k] = (x - F[0]) / dd; stars.dy[k] = (y - F[1]) / dd; stars.dz[k] = (z - F[2]) / dd;
  stars.dist[k] = dd;
  stars.r[k] = c[0]; stars.g[k] = c[1]; stars.b[k] = c[2];
  stars.ring[k] = d.ring;
  stars.ang[k] = Math.atan2(y, x) / TAU;
});
// rigid rotated copies: 30° and 60° clockwise about z (seen from above)
{
  const n0 = dotList.length;
  for (let c = 1; c <= 2; c++) {
    const a = -c * Math.PI / 6, ca = Math.cos(a), sa = Math.sin(a);
    for (let k = 0; k < n0; k++) {
      const j = c * n0 + k, x = stars.x[k], y = stars.y[k];
      stars.x[j] = ca * x - sa * y;
      stars.y[j] = sa * x + ca * y;
      stars.z[j] = stars.z[k];
      const dx = stars.dx[k], dy = stars.dy[k];
      stars.dx[j] = ca * dx - sa * dy;
      stars.dy[j] = sa * dx + ca * dy;
      stars.dz[j] = stars.dz[k];
      stars.dist[j] = stars.dist[k];
      stars.r[j] = stars.r[k]; stars.g[j] = stars.g[k]; stars.b[j] = stars.b[k];
      stars.ring[j] = stars.ring[k];
      stars.ang[j] = stars.ang[k];
    }
  }
}

// wash: warm volumetric glow around each focus
const wash = newFam(2400);
{
  const rng = sfc32(cyrb53(HASH + "::wash") >>> 0, 1234, 5678, 9012);
  const cols = PAL.wash.map(hexRgb);
  let k = 0;
  for (let fi = 0; fi < 5; fi++) for (let i = 0; i < 1200; i++) {
    const F = foci[fi], c = cols[k % 3];
    wash.x[k] = F[0] + gauss(rng) * 0.34;
    wash.y[k] = F[1] + gauss(rng) * 0.34;
    wash.z[k] = F[2] + gauss(rng) * 0.34;
    wash.r[k] = c[0] * PAL.washMul; wash.g[k] = c[1] * PAL.washMul; wash.b[k] = c[2] * PAL.washMul;
    k++;
  }
}

// core spindle: new point family extruded along the z-axis through the
// central vertex (the donut hole). slow fountain flow outward from the center
// + helical twist; pinned out of the fold (the still axle); ignites as the
// fold peaks. per-point flow phase in ang, direction in ring.
// half-lengths: vertical spindle reaches 1.0 (the third shell's radius),
// horizontal stays 0.9.
const CORE_VLEN = 1.5, CORE_HLEN = 1.35;
const core = newFam(700);
{
  const rng = sfc32(cyrb53(HASH + "::core") >>> 0, 2468, 1357, 9876);
  for (let i = 0; i < 700; i++) {
    const z0 = (rng() * 2 - 1) * CORE_VLEN;
    const taper = 0.16 * Math.sqrt(Math.max(0, 1 - (z0 / CORE_VLEN) * (z0 / CORE_VLEN)));
    const a = rng() * TAU, rr = taper * Math.sqrt(rng());
    core.x[i] = CV[0] + rr * Math.cos(a);
    core.y[i] = CV[1] + rr * Math.sin(a);
    core.z[i] = CV[2] + z0;
    const j = (0.9 + rng() * 0.2) * 0.50, cc = hexRgb(PAL.core);
    core.r[i] = cc[0] * j; core.g[i] = cc[1] * j; core.b[i] = cc[2] * j;
    core.ring[i] = z0 >= 0 ? 1 : -1;
    core.ang[i] = rng();
  }
}

// horizontal core spindle: same fountain + twist, extruded along the
// horizontal inter-focal axis through the central vertex — it threads both
// foci. pinned out of the fold like the vertical spindle: together they form
// the still cross the storm revolves around.
const COREH_U = (() => {
  let ux = foci[1][0] - foci[0][0], uy = foci[1][1] - foci[0][1];
  const l = Math.hypot(ux, uy);
  if (l < 1e-9) { ux = 1; uy = 0; } else { ux /= l; uy /= l; }
  return [ux, uy, 0];
})();
const coreh = newFam(700);
{
  const rng = sfc32(cyrb53(HASH + "::coreh") >>> 0, 1122, 3344, 5566);
  const ux = COREH_U[0], uy = COREH_U[1];
  const cc = hexRgb(PAL.core);
  for (let i = 0; i < 700; i++) {
    const s0 = (rng() * 2 - 1) * CORE_HLEN;
    const taper = 0.16 * Math.sqrt(Math.max(0, 1 - (s0 / CORE_HLEN) * (s0 / CORE_HLEN)));
    const a = rng() * TAU, rr = taper * Math.sqrt(rng());
    const wx = -uy * Math.cos(a) * rr, wy = ux * Math.cos(a) * rr, wz = Math.sin(a) * rr;
    coreh.x[i] = CV[0] + ux * s0 + wx;
    coreh.y[i] = CV[1] + uy * s0 + wy;
    coreh.z[i] = CV[2] + wz;
    coreh.dx[i] = wx; coreh.dy[i] = wy; coreh.dz[i] = wz;
    const j = (0.9 + rng() * 0.2) * 0.50;
    coreh.r[i] = cc[0] * j; coreh.g[i] = cc[1] * j; coreh.b[i] = cc[2] * j;
    coreh.ring[i] = s0 >= 0 ? 1 : -1;
    coreh.ang[i] = rng();
  }
}

// concatenate into one struct for a single per-frame loop
// fam: 0 shell, 1 lattice, 2 star, 3 wash, 4 core (vertical), 5 coreh (horizontal)
const ALLS = [...shells.map(s => [s, 0]), ...lattices.map(s => [s, 1]), [stars, 2], [wash, 3], [core, 4], [coreh, 5]];
let TOT = 0;
ALLS.forEach(([f]) => TOT += f.n);
const X = new Float32Array(TOT), Y = new Float32Array(TOT), Z = new Float32Array(TOT),
      RR = new Float32Array(TOT), GG = new Float32Array(TOT), BB = new Float32Array(TOT),
      DX = new Float32Array(TOT), DY = new Float32Array(TOT), DZ = new Float32Array(TOT),
      DIST = new Float32Array(TOT), RING = new Int8Array(TOT), ANG = new Float32Array(TOT),
      FAM = new Int8Array(TOT);
{
  let o = 0;
  for (const [f, tag] of ALLS) {
    X.set(f.x, o); Y.set(f.y, o); Z.set(f.z, o);
    RR.set(f.r, o); GG.set(f.g, o); BB.set(f.b, o);
    DX.set(f.dx, o); DY.set(f.dy, o); DZ.set(f.dz, o);
    DIST.set(f.dist, o); RING.set(f.ring, o); ANG.set(f.ang, o);
    FAM.fill(tag, o, o + f.n);
    o += f.n;
  }
}

// toroidal fold rigging: horizontal ring of radius FOLD_R through the central
// vertex; per point q = nearest ring point, d = p - q, t = ring tangent.
// each frame d rotates about t by the global fold angle — the composition
// folds through itself and back once per 16s loop
const FOLD_R = 1.0, FOLD_AMP = 0.85 * Math.PI;
const FQX = new Float32Array(TOT), FQY = new Float32Array(TOT), FQZ = new Float32Array(TOT),
      FDX = new Float32Array(TOT), FDY = new Float32Array(TOT), FDZ = new Float32Array(TOT),
      FCX = new Float32Array(TOT), FCY = new Float32Array(TOT), FCZ = new Float32Array(TOT),
      FTX = new Float32Array(TOT), FTY = new Float32Array(TOT), FSD = new Float32Array(TOT);
for (let i = 0; i < TOT; i++) {
  const rx = X[i] - CV[0], ry = Y[i] - CV[1];
  const rr = Math.hypot(rx, ry);
  if (rr < 1e-4 || FAM[i] === 4 || FAM[i] === 5) { // on-axis or core spindles: pinned, no fold
    FQX[i] = X[i]; FQY[i] = Y[i]; FQZ[i] = Z[i];
    continue;
  }
  const qx = CV[0] + FOLD_R * rx / rr, qy = CV[1] + FOLD_R * ry / rr;
  const dx = X[i] - qx, dy = Y[i] - qy, dz = Z[i] - CV[2];
  const tx = -ry / rr, ty = rx / rr;
  FQX[i] = qx; FQY[i] = qy; FQZ[i] = CV[2];
  FDX[i] = dx; FDY[i] = dy; FDZ[i] = dz;
  FCX[i] = ty * dz; FCY[i] = -tx * dz; FCZ[i] = tx * dy - ty * dx;
  FTX[i] = tx; FTY[i] = ty; FSD[i] = tx * dx + ty * dy;
}

// accent web: each dot joined to its nearest neighbors (world-space
// distance, across all three rotated fields). Four layers, nested sets:
//   green   — 3 nearest neighbors (~600 threads)
//   purple  — 6 nearest neighbors (~1100 threads)
//   magenta — 9 nearest neighbors (~1600 threads)
//   ember   — 12 nearest neighbors (~2000 threads)
// the pairs are static (dots don't move in world space, only the camera
// does), so they're computed once here and re-projected every frame
let starOff = 0;
for (const [f, tag] of ALLS) { if (tag === 2) break; starOff += f.n; }
const CPAIRS = [], CPAIRS6 = [], CPAIRS9 = [], CPAIRS12 = [], CPAIRS1 = [];
const CONNECTED = new Set(); // Stellar: dots with at least one web line
{
  const n = stars.n, seen1 = new Set(), seen3 = new Set(), seen6 = new Set(), seen9 = new Set(), seen12 = new Set(), KNB = 12;
  for (let i = 0; i < n; i++) {
    const best = [];
    const xi = stars.x[i], yi = stars.y[i], zi = stars.z[i];
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const dx = stars.x[j] - xi, dy = stars.y[j] - yi, dz = stars.z[j] - zi;
      const d = dx * dx + dy * dy + dz * dz;
      if (best.length < KNB || d < best[best.length - 1][0]) {
        best.push([d, j]);
        best.sort((a, b) => a[0] - b[0]);
        if (best.length > KNB) best.length = KNB;
      }
    }
    best.forEach(([, b], k) => {
      const key = i < b ? i * n + b : b * n + i;
      if (k === 0 && !seen1.has(key)) { seen1.add(key); CPAIRS1.push([starOff + i, starOff + b]); }
      if (!seen12.has(key)) { seen12.add(key); CPAIRS12.push([starOff + i, starOff + b]); }
      if (k < 9 && !seen9.has(key)) { seen9.add(key); CPAIRS9.push([starOff + i, starOff + b]); }
      if (k < 6 && !seen6.has(key)) { seen6.add(key); CPAIRS6.push([starOff + i, starOff + b]); }
      if (k < 3 && !seen3.has(key)) { seen3.add(key); CPAIRS.push([starOff + i, starOff + b]); }
    });
  }
}
CPAIRS.forEach(([a, b]) => { CONNECTED.add(a); CONNECTED.add(b); }); // Stellar
// Stellar: unconnected accent dots = FAM 2 without linework (Calvin 2026-10-13)
const UNCONNECTED = [];
for (let i = 0; i < TOT; i++) {
  if (FAM[i] === 2 && !CONNECTED.has(i)) UNCONNECTED.push(i);
}

// core spindle world position at loop phase lpX, for fam 4 (vertical, z-axis)
// or fam 5 (horizontal, inter-focal axis): fountain flow outward from the
// center + helical twist. writes into out[3].
const _cp = [0, 0, 0];
function corePos(i, lpX, out) {
  const dir = RING[i] >= 0 ? 1 : -1;
  let ph = ANG[i] + lpX; ph -= Math.floor(ph);
  const tw = TAU * lpX, tws = 1.5;
  if (FAM[i] === 4) {
    const zl = dir * CORE_VLEN * ph;
    const a = tw + zl * tws, ca = Math.cos(a), sa = Math.sin(a);
    const bx = X[i] - CV[0], by = Y[i] - CV[1];
    out[0] = CV[0] + bx * ca - by * sa;
    out[1] = CV[1] + bx * sa + by * ca;
    out[2] = CV[2] + zl;
    return out;
  }
  const s = dir * CORE_HLEN * ph;
  const a = tw + s * tws, ca = Math.cos(a), sa = Math.sin(a);
  const ux = COREH_U[0], uy = COREH_U[1];
  const wx = DX[i], wy = DY[i], wz = DZ[i];
  const cx = uy * wz, cy = -ux * wz, cz = ux * wy - uy * wx; // u × w
  out[0] = CV[0] + ux * s + wx * ca + cx * sa;
  out[1] = CV[1] + uy * s + wy * ca + cy * sa;
  out[2] = CV[2] + wz * ca + cz * sa;

}
// locked end fade for a spindle dot at world (x,y,z): 1 at the center,
// 0 at the tip — all four spindle ends dissolve instead of cutting off
function coreFade(i, x, y, z) {
  const a = FAM[i] === 4
    ? Math.min(1, Math.abs(z - CV[2]) / CORE_VLEN)
    : Math.min(1, Math.abs((x - CV[0]) * COREH_U[0] + (y - CV[1]) * COREH_U[1]) / CORE_HLEN);
  const f = Math.cos(a * Math.PI / 2);
  return f * f;
}

// core spindle index list + scratch arrays for the tracer pass
const COREI = [];
for (let i = 0; i < TOT; i++) if (FAM[i] === 4 || FAM[i] === 5) COREI.push(i);
const TR1X = new Float32Array(COREI.length), TR1Y = new Float32Array(COREI.length);

// camera: 360° orbit at 45° below the plane, looking up into the central vertex (central axis); drag adds an offset
function basis(th) {
  // orbit circles the central vertex itself: constant distance, CV pinned to canvas center
  const el = -Math.PI / 32, ce = Math.cos(el), se = Math.sin(el);
  const cx = CV[0] + 3.6 * ce * Math.cos(th), cy = CV[1] + 3.6 * ce * Math.sin(th), cz = CV[2] + 3.6 * se;
  const fx0 = CV[0] - cx, fy0 = CV[1] - cy, fz0 = CV[2] - cz;
  const fl = Math.hypot(fx0, fy0, fz0) || 1e-9;
  const fx = fx0 / fl, fy = fy0 / fl, fz = fz0 / fl;
  const rl = Math.hypot(fx, fy) || 1e-9;
  const rx = fy / rl, ry = -fx / rl, rz = 0;                 // right
  const ux2 = ry * fz - rz * fy, uy2 = rz * fx - rx * fz, uz2 = rx * fy - ry * fx; // up
  // screen offset of the aim point: project relative to CV so it lands on canvas center
  const ox = CV[0] * rx + CV[1] * ry + CV[2] * rz;
  const oy = CV[0] * ux2 + CV[1] * uy2 + CV[2] * uz2;
  return { rx, ry, rz, ux: ux2, uy: uy2, uz: uz2, fx, fy, fz, ox, oy };
}

// fit framing over the whole orbit
let SC = 140;
{
  let mx = 0;
  // sample fold extremes too — the fold swings points beyond the base volume
  const folds = [-FOLD_AMP, -FOLD_AMP / 2, 0, FOLD_AMP / 2, FOLD_AMP];
  for (let a = 0; a < 16; a++) {
    const b = basis(a / 32 * TAU);
    for (const fa of folds) {
      const fc = Math.cos(fa), fs = Math.sin(fa), fk = 1 - fc;
      for (let i = 0; i < TOT; i++) {
        const x = FQX[i] + FDX[i] * fc + FCX[i] * fs + FTX[i] * FSD[i] * fk;
        const y = FQY[i] + FDY[i] * fc + FCY[i] * fs + FTY[i] * FSD[i] * fk;
        const z = FQZ[i] + FDZ[i] * fc + FCZ[i] * fs;
        const sx = x * b.rx + y * b.ry + z * b.rz - b.ox;
        const sy = x * b.ux + y * b.uy + z * b.uz - b.oy;
        const m = Math.max(Math.abs(sx), Math.abs(sy));
        if (m > mx) mx = m;
      }
    }
  }
  SC = 2.16 * 1.7019348369 * (S / 2 - 30) / mx; // zoomed in 10% more (Stellar, Calvin 2026-10-16)
}

// interaction: drag to look around (adds an offset to the 360° orbit)
const cv = document.getElementById("c");
let dragTheta = 0, dragging = false, lastPX = 0;
// Stellar: drag-to-rotate disabled (Calvin 2026-10-13)
if (false) {
cv.addEventListener("pointerdown", e => {
  dragging = true; lastPX = e.clientX; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (dragging) { dragTheta += (e.clientX - lastPX) * 0.01; lastPX = e.clientX; }
});
cv.addEventListener("pointerup", () => dragging = false);
cv.addEventListener("pointercancel", () => dragging = false);
cv.addEventListener("dblclick", () => dragTheta = 0);
}

const ctx = cv.getContext("2d");
const img = ctx.createImageData(S, S);
const pxd = img.data;
const SXA = new Float32Array(TOT), SYA = new Float32Array(TOT),
      SZA = new Float32Array(TOT), BRA = new Float32Array(TOT), ALA = new Float32Array(TOT);
const t0 = performance.now();

function draw(now) {
  const t = (now - t0) / 1000;
  const lp = 0; // Stellar: camera rotation stopped (Calvin 2026-10-12)
  const wp = (t % 8) / 8;   // 8s breath: 4s out, 4s in — choreography intact
  const b = basis(TAU * lp + dragTheta); // 360° orbit; drag adds an offset
  const tri = wp < 0.5 ? wp * 2 : 2 - wp * 2;
  const W0 = RMAX * tri;  // radial wave: 4s out, 4s in (Stellar, Calvin 2026-10-13)
  const tSec = wp * 8;
  // Stellar: toroidal fold — continuous seamless twist, one revolution per 16s (Calvin 2026-10-13)
  const fp = (t % 16) / 16;
  const fa = TAU * fp;
  const fc = Math.cos(fa), fs = Math.sin(fa), fk = 1 - fc;

  let smin = Infinity, smax = -Infinity;
  for (let i = 0; i < TOT; i++) {
    // fold first (rigid rotation about the ring tangent), then the wave rides on top
    let x = FQX[i] + FDX[i] * fc + FCX[i] * fs + FTX[i] * FSD[i] * fk;
    let y = FQY[i] + FDY[i] * fc + FCY[i] * fs + FTY[i] * FSD[i] * fk;
    let z = FQZ[i] + FDZ[i] * fc + FCZ[i] * fs, br = 1;
    const fm = FAM[i];
    if (fm === 0 || fm === 2) {
      const d = DIST[i];
      const q0 = (d - W0) / 0.22;
      const g = Math.exp(-q0 * q0);
      const amp = fm === 0 ? 0.10 : 0.08;
      x += DX[i] * g * amp; y += DY[i] * g * amp; z += DZ[i] * g * amp;
      br = fm === 0 ? 1 + 2 * Math.min(g, 1.2) : 1 + 0.8 * g;
    }
    if (fm === 4 || fm === 5) {
      // core spindles: fountain flow outward from the center + helical twist
      corePos(i, lp, _cp);
      x = _cp[0]; y = _cp[1]; z = _cp[2];
      // locked end fade: 1 at the center, 0 at the tip (all four ends fade out)
      const ax = fm === 4
        ? Math.min(1, Math.abs(z - CV[2]) / CORE_VLEN)
        : Math.min(1, Math.abs((x - CV[0]) * COREH_U[0] + (y - CV[1]) * COREH_U[1]) / CORE_HLEN);
      const fade = Math.cos(ax * Math.PI / 2) ** 2;
      br = (0.9 + 1.0 * Math.abs(Math.sin(TAU * lp))) * fade; // ignites at fold peaks
    }
    const sx = x * b.rx + y * b.ry + z * b.rz - b.ox;
    const sy = x * b.ux + y * b.uy + z * b.uz - b.oy;
    const sz = x * b.fx + y * b.fy + z * b.fz;
    SXA[i] = sx; SYA[i] = sy; SZA[i] = sz; BRA[i] = br;
    if (sz < smin) smin = sz;
    if (sz > smax) smax = sz;
    if (fm === 2) {
      // harmonic third order: rings cycle +1 / -1 / +2 by ring index mod 3 —
      // single arc sweeping CW, single arc sweeping CCW, double arc sweeping CW
      const rm3 = ((RING[i] % 3) + 3) % 3;
      const th = rm3 === 0 ? ANG[i] : rm3 === 1 ? -ANG[i] : 2 * ANG[i];
      // blink clock tSec resets every 8s phrase, so the rate must complete an
      // integer number of cycles per phrase: 11 cycles/phrase = 1.375 Hz
      // (~1/3 slower than the original 2 Hz); all three orders share it
      ALA[i] = 1; // steady (Calvin 2026-10-13)
    } else {
      ALA[i] = 1;
    }
  }

  pxd.fill(0);
  const span = Math.max(smax - smin, 1e-6);
  const half = S / 2;
  for (let i = 0; i < TOT; i++) {
    const zn = (smax - SZA[i]) / span;  // 1 = nearest: near geometry renders brighter
    const sh = (0.65 + 0.35 * zn) * BRA[i] * (FAM[i] === 2 ? ALA[i] : 1);
    const r = RR[i] * sh * 255, g = GG[i] * sh * 255, bl = BB[i] * sh * 255;
    const Xp = Math.round(SXA[i] * SC + half), Yp = Math.round(SYA[i] * SC + half);
    if (Xp < 0 || Yp < 0 || Xp >= S || Yp >= S) continue;
    if (FAM[i] !== 2) continue; // Stellar: only accent dots + web visible (Calvin 2026-10-12)

    if (FAM[i] === 2) {
      // Stellar: clean solid dots — no halo wash, full opacity (Calvin 2026-10-13)
      const R = 16 / 9;
      const r2 = RR[i] * 255, g2 = GG[i] * 255, bl2 = BB[i] * 255;
      for (let dy = -R; dy <= R; dy++) {
        const yy = Yp + dy;
        if (yy < 0 || yy >= S) continue;
        const dxm = Math.floor(Math.sqrt(R * R - dy * dy));
        for (let dx = -dxm; dx <= dxm; dx++) {
          const xx = Xp + dx;
          if (xx < 0 || xx >= S) continue;
          const o = (yy * S + xx) * 4;
          pxd[o] = Math.min(255, pxd[o] + r2);
          pxd[o + 1] = Math.min(255, pxd[o + 1] + g2);
          pxd[o + 2] = Math.min(255, pxd[o + 2] + bl2);
          pxd[o + 3] = 255;
        }
      }
      continue;
    }
    if (FAM[i] === 4 || FAM[i] === 5) {
      // core spindle dots: solid core + soft radial wash, matching the accent glow
      const R = 1.2, W = 3.5;
      for (let dy = -W; dy <= W; dy++) {
        const yy = Yp + dy;
        if (yy < 0 || yy >= S) continue;
        const dxm = Math.floor(Math.sqrt(W * W - dy * dy));
        for (let dx = -dxm; dx <= dxm; dx++) {
          const xx = Xp + dx;
          if (xx < 0 || xx >= S) continue;
          const d = Math.sqrt(dx * dx + dy * dy);
          const t = Math.max(0, 1 - d / W), wa = t * t * 0.5; // wash falloff
          const core = d <= R ? 1 : 0;
          const o = (yy * S + xx) * 4;
          pxd[o] = Math.min(255, pxd[o] + r * (core + wa));
          pxd[o + 1] = Math.min(255, pxd[o + 1] + g * (core + wa));
          pxd[o + 2] = Math.min(255, pxd[o + 2] + bl * (core + wa));
          pxd[o + 3] = 255;
        }
      }
      continue;
    }
    if (FAM[i] === 0) {
      // wave shells: 2x2 so the wavefront reads in the negative space
      for (let ddy = 0; ddy < 2; ddy++) for (let ddx = 0; ddx < 2; ddx++) {
        const xx = Xp + ddx, yy = Yp + ddy;
        if (xx < 0 || yy < 0 || xx >= S || yy >= S) continue;
        const o2 = (yy * S + xx) * 4;
        pxd[o2] = Math.min(255, pxd[o2] + r);
        pxd[o2 + 1] = Math.min(255, pxd[o2 + 1] + g);
        pxd[o2 + 2] = Math.min(255, pxd[o2 + 2] + bl);
        pxd[o2 + 3] = 255;
      }
      continue;
    }
    let o = (Yp * S + Xp) * 4;
    pxd[o] = Math.min(255, pxd[o] + r);
    pxd[o + 1] = Math.min(255, pxd[o + 1] + g);
    pxd[o + 2] = Math.min(255, pxd[o + 2] + bl);
    pxd[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // core tracers: DISABLED for Stellar (spindles removed, Calvin 2026-10-12)
  if (false) {
  // longer fading trails behind each spindle dot along the
  // fountain flow — four 0.25s back-samples (1.0s trail), each with its own
  // camera. a dot that recycled between samples teleports tip->center: its
  // trail is meaningless, so segments longer than 0.1 world units are skipped.
  // each segment also fades progressively toward the spindle tips (4 alpha
  // buckets keep the stroke count low).
  {
    const TRD = 0.25 / 16, WRAP2 = 0.1 * 0.1, NTR = 4;
    const coreGain = 0.9 + 1.0 * Math.abs(Math.sin(TAU * lp));
    const TAL = [0.78, 0.55, 0.35, 0.20];
    ctx.save();
    ctx.lineWidth = 2;
    ctx.strokeStyle = PAL.core;
    const hx = new Float32Array(COREI.length), hy = new Float32Array(COREI.length);
    const ha = new Float32Array(COREI.length);
    const sxa = new Float32Array(COREI.length), sya = new Float32Array(COREI.length);
    const exa = new Float32Array(COREI.length), eya = new Float32Array(COREI.length);
    const sfa = new Float32Array(COREI.length);
    for (let ci = 0; ci < COREI.length; ci++) {
      const i = COREI[ci];
      hx[ci] = SXA[i]; hy[ci] = SYA[i];
      corePos(i, lp, _cp);
      ha[ci] = coreFade(i, _cp[0], _cp[1], _cp[2]);
    }
    for (let s = 0; s < NTR; s++) {
      const b = basis(TAU * (lp - TRD * (s + 1)) + dragTheta);
      for (let ci = 0; ci < COREI.length; ci++) {
        const i = COREI[ci];
        corePos(i, lp - TRD * (s + 1), _cp);
        const ex = _cp[0] * b.rx + _cp[1] * b.ry + _cp[2] * b.rz - b.ox;
        const ey = _cp[0] * b.ux + _cp[1] * b.uy + _cp[2] * b.uz - b.oy;
        const dx = ex - hx[ci], dy = ey - hy[ci];
        const ok = dx * dx + dy * dy <= WRAP2;
        const fa = coreFade(i, _cp[0], _cp[1], _cp[2]);
        sxa[ci] = hx[ci]; sya[ci] = hy[ci];
        exa[ci] = ex; eya[ci] = ey;
        sfa[ci] = ok ? (ha[ci] + fa) / 2 : 0;
        hx[ci] = ex; hy[ci] = ey; ha[ci] = fa;
      }
      for (let q = 0; q < 4; q++) {
        ctx.globalAlpha = TAL[s] * coreGain * (q + 0.5) / 4;
        ctx.beginPath();
        for (let ci = 0; ci < COREI.length; ci++) {
          if (Math.min(3, (sfa[ci] * 4) | 0) !== q) continue;
          ctx.moveTo(sxa[ci] * SC + half, sya[ci] * SC + half);
          ctx.lineTo(exa[ci] * SC + half, eya[ci] * SC + half);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  } // end if(false) — Stellar tracers disabled
  // Stellar: 3-nearest-neighbor web, each segment gradients between its dots' colors (Calvin 2026-10-13)
  ctx.save();
  ctx.lineWidth = 0.75; // (Calvin 2026-10-12)
  ctx.globalAlpha = PAL.web6[1]; // steady (Calvin 2026-10-13)
  for (let s = 0; s < CPAIRS.length; s++) {
    const a = CPAIRS[s][0], b2 = CPAIRS[s][1];
    const x1 = SXA[a] * SC + half, y1 = SYA[a] * SC + half;
    const x2 = SXA[b2] * SC + half, y2 = SYA[b2] * SC + half;
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, `rgb(${RR[a] * 255 | 0},${GG[a] * 255 | 0},${BB[a] * 255 | 0})`);
    grad.addColorStop(1, `rgb(${RR[b2] * 255 | 0},${GG[b2] * 255 | 0},${BB[b2] * 255 | 0})`);
    ctx.strokeStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  ctx.restore();
  // Stellar: larger interlocking circles on unconnected accent dots, each in its dot's color (Calvin 2026-10-13)
  ctx.save();
  ctx.lineWidth = 0.75;
  ctx.globalAlpha = PAL.web6[1];
  for (let k = 0; k < UNCONNECTED.length; k++) {
    const i = UNCONNECTED[k];
    const cx = SXA[i] * SC + half, cy = SYA[i] * SC + half;
    let nd = Infinity;
    for (let m = 0; m < UNCONNECTED.length; m++) {
      if (m === k) continue;
      const j = UNCONNECTED[m];
      const dx = (SXA[j] - SXA[i]) * SC, dy = (SYA[j] - SYA[i]) * SC;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < nd) nd = d;
    }
    if (!isFinite(nd) || nd <= 0) continue;
    ctx.strokeStyle = `rgb(${RR[i] * 255 | 0},${GG[i] * 255 | 0},${BB[i] * 255 | 0})`;
    ctx.beginPath();
    // Size variance 0.7x-2.3x (Calvin 2026-10-16): hash-seeded per-circle
    const szSeed = cyrb53(HASH + "::dotsize::" + i) % 1000 / 1000;
    const szMul = 0.7 + szSeed * 1.6;
    ctx.arc(cx, cy, nd * 1.2 * szMul, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
  // soft glow pass: blurred copy of the sharp frame laid back over itself
  ctx.save();
  ctx.filter = "blur(2px)";
  ctx.globalAlpha = 0.6667;
  ctx.drawImage(cv, 0, 0);
  ctx.restore();
  // Stellar: 4-way kaleidoscope — capture pristine frame, composite 4 flips (Calvin 2026-10-12)
  // (stretch/squish removed 2026-10-13 — frame square again)
  const frame = document.createElement("canvas");
  frame.width = S; frame.height = S;
  frame.getContext("2d").drawImage(cv, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, S, S); // opaque (not clearRect): captureStream sees the true composite
  ctx.drawImage(frame, 0, 0); // original
  ctx.save(); ctx.translate(0, S); ctx.scale(1, -1);
  ctx.drawImage(frame, 0, 0); ctx.restore(); // vertical flip
  ctx.save(); ctx.translate(S, 0); ctx.scale(-1, 1);
  ctx.drawImage(frame, 0, 0); ctx.restore(); // horizontal flip
  ctx.save(); ctx.translate(S, S); ctx.scale(-1, -1);
  ctx.drawImage(frame, 0, 0); ctx.restore(); // both (180°)
  // Stellar: duplicate entire composition, rotated 90° about the shared center (Calvin 2026-10-14)
  // Fixed 2026-10-16: capture to offscreen first (drawing canvas onto itself is unreliable)
  const frame90 = document.createElement("canvas");
  frame90.width = S; frame90.height = S;
  frame90.getContext("2d").drawImage(cv, 0, 0);
  ctx.save();
  ctx.translate(S / 2, S / 2);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(frame90, -S / 2, -S / 2);
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
